# HirebridgeHR — Production Nginx config
# Assumes SSL certs at /etc/letsencrypt/live/hirebridgehr.com/

upstream api_backend {
    server 127.0.0.1:4000;
}

upstream web_frontend {
    server 127.0.0.1:5173;
}

upstream admin_frontend {
    server 127.0.0.1:5174;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name hirebridgehr.com www.hirebridgehr.com app.hirebridgehr.com admin.hirebridgehr.com api.hirebridgehr.com;
    return 301 https://$host$request_uri;
}

# Marketing site
server {
    listen 443 ssl http2;
    server_name hirebridgehr.com www.hirebridgehr.com;

    ssl_certificate /etc/letsencrypt/live/hirebridgehr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirebridgehr.com/privkey.pem;

    root /var/www/hirebridgehr/marketing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Customer app
server {
    listen 443 ssl http2;
    server_name app.hirebridgehr.com;

    ssl_certificate /etc/letsencrypt/live/hirebridgehr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirebridgehr.com/privkey.pem;

    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Admin panel
server {
    listen 443 ssl http2;
    server_name admin.hirebridgehr.com;

    ssl_certificate /etc/letsencrypt/live/hirebridgehr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirebridgehr.com/privkey.pem;

    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# API
server {
    listen 443 ssl http2;
    server_name api.hirebridgehr.com;

    ssl_certificate /etc/letsencrypt/live/hirebridgehr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirebridgehr.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
