services:
  postgres:
    image: postgres:16-alpine
    container_name: hirebridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirebridge
      POSTGRES_PASSWORD: hirebridge_dev_password
      POSTGRES_DB: hirebridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirebridge -d hirebridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirebridge_redis
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
